<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1112" />
    <title>Задания — тест</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=PT+Mono&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0b1112;
        --panel: #111a1c;
        --panel2: #162225;
        --card: #0e1618;
        --stage: #0d1517;
        --moss: #6b9383;
        --gold: #c2a878;
        --gold-hi: #f0d9a8;
        --gold-soft: rgba(194, 168, 120, 0.16);
        --text: #d4e0de;
        --muted: #798c89;
        --line: #223336;
        --line2: #31474a;
        --ok: #8ac47a;
        --err: #c07a6c;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font:
          16px/1.6 "PT Serif",
          serif;
        min-height: 100vh;
        overflow-x: hidden;
        padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px));
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: -1;
        background:
          radial-gradient(
            circle at 12% 8%,
            rgba(107, 147, 131, 0.07),
            transparent 42%
          ),
          radial-gradient(
            circle at 88% 36%,
            rgba(194, 168, 120, 0.04),
            transparent 42%
          ),
          radial-gradient(
            circle at 50% 100%,
            rgba(174, 189, 189, 0.05),
            transparent 55%
          );
      }
      .fog {
        position: fixed;
        top: -25%;
        left: -25%;
        width: 150%;
        height: 150%;
        pointer-events: none;
        filter: blur(30px);
        mix-blend-mode: screen;
        opacity: 0.85;
      }
      .f1 {
        background: radial-gradient(
          ellipse 55% 35% at 20% 30%,
          rgba(215, 226, 224, 0.07),
          transparent 70%
        );
      }
      .f2 {
        background: radial-gradient(
          ellipse 45% 30% at 80% 65%,
          rgba(194, 168, 120, 0.06),
          transparent 70%
        );
      }
      .f3 {
        background: radial-gradient(
          ellipse 60% 40% at 55% 90%,
          rgba(107, 147, 131, 0.08),
          transparent 70%
        );
      }
      .vignette {
        position: fixed;
        inset: 0;
        z-index: 5;
        pointer-events: none;
        background: radial-gradient(
          ellipse 75% 65% at 50% 45%,
          transparent 45%,
          rgba(6, 9, 10, 0.55) 100%
        );
      }
      .firefly {
        position: fixed;
        width: 2px;
        height: 2px;
        background: var(--gold);
        opacity: 0;
        animation: drift 10s ease-in-out infinite;
        pointer-events: none;
        z-index: 1;
        box-shadow: 0 0 6px 1px rgba(194, 168, 120, 0.6);
      }
      @keyframes drift {
        0% {
          opacity: 0;
          transform: translate(0, 0);
        }
        50% {
          opacity: 0.55;
          transform: translate(-15px, -22px);
        }
        100% {
          opacity: 0;
          transform: translate(-5px, -42px);
        }
      }
      @keyframes fade {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes shake {
        25% {
          transform: translateX(-4px);
        }
        75% {
          transform: translateX(4px);
        }
      }
      h1,
      h3,
      .display {
        font-family: "Cormorant Garamond", serif;
        font-weight: 400;
      }
      .wrap {
        max-width: 760px;
        margin: 0 auto;
        padding: calc(36px + env(safe-area-inset-top, 0px)) 16px 0;
        position: relative;
        z-index: 2;
        animation: fade 0.5s ease;
      }
      .list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
        padding: 14px 16px;
        background: var(--panel2);
        border: 1px solid var(--line);
        color: var(--text);
        font:
          15px "PT Serif",
          serif;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      .item:active {
        background: var(--card);
      }
      .item em {
        font:
          normal 13px "PT Mono",
          monospace;
        color: var(--gold);
      }
      .item.done {
        border-color: var(--gold);
      }

      .backdrop {
        position: fixed;
        inset: 0;
        background: rgba(6, 10, 11, 0.88);
        display: none;
        align-items: flex-start;
        justify-content: center;
        z-index: 1000;
        padding: 24px 16px;
        overflow-y: auto;
        backdrop-filter: blur(6px);
      }
      .backdrop.open {
        display: flex;
        animation: fade 0.2s ease;
      }
      .modal {
        background: var(--panel);
        border: 1px solid var(--line);
        padding: 26px 20px;
        width: 100%;
        max-width: 560px;
        margin: auto 0;
        flex-shrink: 0;
        position: relative;
        box-shadow:
          0 30px 80px -30px rgba(0, 0, 0, 0.85),
          0 0 0 1px var(--gold-soft);
      }
      .modal::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        height: 2px;
        width: 64px;
        background: linear-gradient(90deg, var(--gold), transparent);
      }
      .close {
        position: absolute;
        top: 14px;
        right: 16px;
        background: none;
        border: none;
        padding: 6px;
        color: var(--muted);
        font-size: 22px;
        line-height: 1;
        cursor: pointer;
        transition: 0.2s;
      }
      .close:hover {
        color: var(--gold);
      }
      .head {
        display: flex;
        gap: 14px;
        align-items: center;
        margin-bottom: 18px;
        padding-right: 24px;
      }
      .icon {
        width: 46px;
        height: 46px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--panel2);
        border: 1px solid var(--gold-soft);
        color: var(--gold);
        font-size: 20px;
      }
      .head h3 {
        font-size: 25px;
        color: var(--gold);
        margin: 0;
      }

      .tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 10px;
      }
      .tab {
        flex: 1 1 44px;
        padding: 9px 4px;
        background: none;
        border: 1px solid var(--line);
        color: var(--muted);
        font:
          11px "PT Mono",
          monospace;
        letter-spacing: 0.1em;
        cursor: pointer;
        transition: 0.2s;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }
      .tab:hover:not(:disabled) {
        border-color: rgba(194, 168, 120, 0.4);
        color: var(--gold);
      }
      .tab:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }
      .tab.done {
        border-color: var(--ok);
        color: var(--ok);
        background: rgba(138, 196, 122, 0.14);
      }
      .tab.active {
        border-color: var(--gold);
        color: var(--gold);
        background: rgba(194, 168, 120, 0.1);
      }
      .legend,
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 10px;
        margin-bottom: 10px;
        font:
          10px "PT Mono",
          monospace;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .legend span {
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      .legend i {
        width: 12px;
        height: 12px;
        border-radius: 2px;
        border: 1px solid rgba(255, 255, 255, 0.14);
      }
      .chips span {
        padding: 4px 9px;
        border: 1px solid rgba(194, 168, 120, 0.25);
        color: var(--gold);
        background: rgba(194, 168, 120, 0.08);
        transition: 0.3s;
      }
      .chips .done {
        color: var(--ok);
        border-color: rgba(138, 196, 122, 0.5);
        background: rgba(138, 196, 122, 0.12);
      }
      .chips .no {
        color: var(--err);
        border-color: rgba(192, 122, 108, 0.4);
        background: rgba(192, 122, 108, 0.08);
      }
      .row {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 8px;
        font:
          10px/1.4 "PT Mono",
          monospace;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .row b {
        color: var(--gold);
        font-weight: 400;
      }
      .row b.warn {
        color: #e05a30;
      }
      .stage {
        display: flex;
        justify-content: center;
        background: var(--stage);
        border: 1px solid var(--line);
        border-radius: 3px;
        padding: 10px;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      .stage.col {
        display: block;
      }
      .stage canvas {
        display: block;
        max-width: 100%;
        border: 1px solid #1a2528;
        cursor: crosshair;
        touch-action: manipulation;
      }
      .drag .stage canvas {
        touch-action: none;
      }
      .acts {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }
      .btn {
        flex: 1;
        padding: 12px 10px;
        background: none;
        border: 1px solid var(--line);
        border-radius: 3px;
        color: var(--muted);
        font:
          11px "PT Mono",
          monospace;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        cursor: pointer;
        transition: 0.25s;
        -webkit-tap-highlight-color: transparent;
      }
      .btn:hover:not(:disabled) {
        border-color: rgba(194, 168, 120, 0.4);
        color: var(--gold);
        background: rgba(194, 168, 120, 0.04);
      }
      .btn.primary {
        background: var(--gold);
        border-color: var(--gold);
        color: var(--bg);
        font-weight: 700;
      }
      .btn.primary:hover:not(:disabled) {
        background: #d4ba8a;
        color: var(--bg);
      }
      .btn:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }
      .status {
        margin-top: 12px;
        min-height: 48px;
        padding: 12px 14px;
        font-size: 13px;
        line-height: 1.55;
        border-left: 3px solid var(--line);
        border-radius: 0 3px 3px 0;
        background: var(--stage);
        color: var(--muted);
        transition: 0.3s;
      }
      .status .sub {
        display: block;
        margin-top: 4px;
        font-size: 10.5px;
        letter-spacing: 0.05em;
        opacity: 0.85;
      }
      .status.good {
        color: var(--ok);
        border-color: var(--ok);
        background: rgba(138, 196, 122, 0.07);
      }
      .status.bad {
        color: var(--err);
        border-color: var(--err);
        background: rgba(192, 122, 108, 0.07);
      }
      .final {
        padding: 28px 18px;
        text-align: center;
        border: 1px solid rgba(194, 168, 120, 0.35);
        border-radius: 3px;
        background: radial-gradient(
          ellipse 90% 40% at 50% 0%,
          rgba(194, 168, 120, 0.1),
          transparent 70%
        );
        animation: fade 0.7s ease both;
      }
      .final .big {
        font:
          28px "Cormorant Garamond",
          serif;
        color: var(--gold);
        margin-bottom: 6px;
      }
      .final .small {
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 18px;
      }
      .final .btn {
        width: 100%;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        width: 100%;
        max-width: 480px;
      }
      .card {
        position: relative;
        aspect-ratio: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 10px;
        background: #141e21;
        border: 1px solid var(--line);
        border-radius: 3px;
        cursor: pointer;
        transition: 0.25s;
        animation: fade 0.35s ease backwards;
      }
      .card img {
        max-width: 88%;
        max-height: 88%;
        object-fit: contain;
        pointer-events: none;
        filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.6));
        transition: transform 0.3s;
      }
      .card span {
        font-size: 12px;
        text-align: center;
        color: var(--muted);
      }
      .card:hover {
        border-color: rgba(194, 168, 120, 0.45);
        background: #1a272b;
        transform: translateY(-3px);
      }
      .card:hover img {
        transform: scale(1.05);
      }
      .card:active {
        transform: scale(0.97);
      }
      .card.selected {
        border-color: var(--gold);
        background: rgba(194, 168, 120, 0.12);
        box-shadow:
          0 0 0 1px rgba(194, 168, 120, 0.6),
          0 0 26px -6px rgba(194, 168, 120, 0.85);
      }
      .card.selected::after {
        content: "●";
        position: absolute;
        right: 7px;
        bottom: 5px;
        color: var(--gold);
        font-size: 15px;
      }
      .card.locked {
        cursor: default;
        pointer-events: none;
      }
      .card.right {
        border-color: var(--ok);
        background: rgba(138, 196, 122, 0.12);
        box-shadow:
          0 0 0 1px rgba(138, 196, 122, 0.6),
          0 0 26px -6px rgba(138, 196, 122, 0.8);
      }
      .card.right::after {
        content: "✓";
        position: absolute;
        right: 7px;
        bottom: 5px;
        color: var(--ok);
        font-size: 16px;
        font-weight: 700;
      }
      .grid.shake {
        animation: shake 0.4s;
      }

      .riddles {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .riddle {
        padding: 14px 16px;
        background: var(--panel2);
        border: 1px solid var(--line);
        transition: 0.25s;
      }
      .riddle p {
        margin: 0 0 10px;
        font-size: 13.5px;
        line-height: 1.5;
      }
      .riddle.solved {
        border-color: var(--gold-soft);
        background:
          radial-gradient(
            ellipse 90% 40% at 50% 0%,
            rgba(194, 168, 120, 0.06),
            transparent 70%
          ),
          var(--panel2);
      }
      .field {
        width: 100%;
        padding: 9px 11px;
        background: var(--card);
        border: 1px solid var(--line);
        color: var(--text);
        font:
          16px "PT Serif",
          serif;
      }
      .field:focus {
        outline: none;
        border-color: var(--gold-soft);
      }
      .solved .field {
        color: var(--gold);
        border-color: var(--gold-soft);
        background: var(--gold-soft);
      }
      .field.word {
        flex: 1;
        text-align: center;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        font:
          18px "PT Mono",
          monospace;
        color: var(--gold);
        background: var(--panel2);
      }
      .letters {
        margin-top: 10px;
        padding: 14px 12px 16px;
        background: var(--stage);
        border: 1px solid var(--line);
        border-radius: 3px;
      }
      .tiles-label {
        text-align: center;
        font:
          10px "PT Mono",
          monospace;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .tiles {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
        margin-top: 10px;
      }
      .tile {
        width: 42px;
        height: 52px;
        display: flex;
        align-items: center;
        justify-content: center;
        font:
          26px "Cormorant Garamond",
          serif;
        color: var(--muted);
        background: var(--panel2);
        border: 1px solid var(--line);
        border-bottom: 2px solid var(--line2);
      }
      .tile.on {
        color: var(--gold);
        border-color: var(--gold-soft);
        background: radial-gradient(
          ellipse 80% 60% at 50% 20%,
          rgba(194, 168, 120, 0.16),
          var(--panel2)
        );
        box-shadow: 0 0 14px -4px rgba(194, 168, 120, 0.5);
      }

      @media (max-width: 600px) {
        .backdrop {
          padding: 10px;
          align-items: center;
        }
        .modal {
          padding: 20px 12px 14px;
        }
        .head {
          gap: 10px;
          margin-bottom: 12px;
        }
        .icon {
          width: 36px;
          height: 36px;
          font-size: 16px;
        }
        .head h3 {
          font-size: 20px;
        }
        .stage {
          padding: 6px;
        }
        .btn {
          min-height: 46px;
          font-size: 10px;
          letter-spacing: 0.06em;
        }
        .tab {
          font-size: 10px;
          padding: 8px 4px;
        }
        .grid {
          grid-template-columns: repeat(2, 1fr);
          gap: 6px;
        }
        .card {
          padding: 6px;
        }
        .tile {
          width: 34px;
          height: 44px;
          font-size: 20px;
        }
      }
    </style>
  </head>
  <body>
    <span class="fog f1"></span><span class="fog f2"></span
    ><span class="fog f3"></span>
    <span class="firefly" style="top: 20%; left: 75%"></span
    ><span
      class="firefly"
      style="top: 60%; left: 85%; animation-delay: 2.5s"
    ></span
    ><span
      class="firefly"
      style="top: 75%; left: 65%; animation-delay: 7.5s"
    ></span>
    <div class="vignette"></div>

    <div class="wrap">
      <div class="list" id="list"></div>
    </div>

    <div class="backdrop" id="bd">
      <div class="modal">
        <button class="close" id="close">✕</button>
        <div id="body"></div>
      </div>
    </div>

    <script>
      (function () {
        "use strict";

        const SEED = 170717,
          ROM = ["I", "II", "III", "IV", "V", "VI", "VII", "VIII"];
        const $ = (s, r = document) => r.querySelector(s);
        const load = (k, d) => {
          try {
            const v = JSON.parse(localStorage.getItem(k));
            return v == null ? d : v;
          } catch (e) {
            return d;
          }
        };
        const save = (k, v) => {
          try {
            localStorage.setItem(k, JSON.stringify(v));
          } catch (e) {}
        };
        const rng = (s) => {
          s = s >>> 0 || 1;
          return () => {
            s = (s + 0x6d2b79f5) | 0;
            let t = Math.imul(s ^ (s >>> 15), 1 | s);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        };
        const shuf = (a, r) => {
          a = a.slice();
          for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(r() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
          }
          return a;
        };
        const watch = (el, f) => new ResizeObserver(f).observe(el);
        const btn = (t, c, f) => {
          const e = document.createElement("button");
          e.className = "btn " + c;
          e.textContent = t;
          e.onclick = f;
          return e;
        };
        const fit = (cv, w, h) => {
          const d = devicePixelRatio || 1;
          cv.width = w * d;
          cv.height = h * d;
          cv.style.width = w + "px";
          cv.style.height = h + "px";
          const c = cv.getContext("2d");
          c.setTransform(d, 0, 0, d, 0, 0);
          return c;
        };

        function shell(host, count, pick) {
          host.classList.add("task");
          host.innerHTML =
            '<div class="tabs"></div><div class="row"><span></span><span></span></div><div class="stage"></div><div class="acts"></div><div class="status"></div>';
          const row = $(".row", host),
            st = $(".status", host),
            tabs = [];
          for (let i = 0; i < count; i++) {
            const e = document.createElement("button");
            e.className = "tab";
            e.onclick = () => pick(i);
            $(".tabs", host).append(e);
            tabs.push(e);
          }
          return {
            row,
            stage: $(".stage", host),
            acts: $(".acts", host),
            left: (h) => {
              row.children[0].innerHTML = h;
            },
            right: (h) => {
              row.children[1].innerHTML = h;
            },
            say: (c, m, s) => {
              st.className = "status " + (c || "");
              st.innerHTML =
                m + (s ? '<span class="sub">' + s + "</span>" : "");
            },
            tabs: (d, a, l) =>
              tabs.forEach((e, i) => {
                e.className =
                  "tab" + (d(i) ? " done" : "") + (i === a ? " active" : "");
                e.textContent = ROM[i] + (d(i) ? " ✓" : "");
                e.disabled = !!(l && l(i));
              }),
          };
        }
        function finale(host, text, cb) {
          host.innerHTML =
            '<div class="final"><div class="big">Все уровни пройдены</div><div class="small">' +
            text +
            "</div></div>";
          host.firstChild.append(btn("Хорошо", "primary", cb));
        }

        const Sea = (host, done) => {
          const key = "sea_done::" + SEED,
            fin = new Set(load(key, []));
          const LV = [
            [12, 3, 36],
            [14, 4, 48],
            [16, 5, 60],
            [18, 6, 74],
            [20, 7, 90],
          ];
          const BAND = [
            [3, "Очень горячо", "rgba(168,65,42,.72)"],
            [6, "Горячо", "rgba(154,102,52,.62)"],
            [10, "Тепло", "rgba(138,138,60,.52)"],

        const Pattern = (host, done) => {

            g.addColorStop(0, gl);
            g.addColorStop(1, "rgba(0,0,0,0)");
            cx.fillStyle = g;
            cx.beginPath();
            cx.arc(px, py, r * 2, 0, 7);
            cx.fill();
            cx.fillStyle = col;
            cx.beginPath();
            cx.arc(px, py, r * 0.55, 0, 7);
            cx.fill();
            cx.fillStyle = "rgba(255,255,255,0.7)";
            cx.beginPath();
            cx.arc(px - r * 0.18, py - r * 0.18, r * 0.16, 0, 7);
            cx.fill();
          }
          function paint() {
            const S = GW * C;
            cx.clearRect(0, 0, S, S);
            cx.fillStyle = "#0a1012";
            cx.fillRect(0, 0, S, S);
            for (let y = 0; y < GH; y++)
              for (let x = 0; x < GW; x++) {
                if (grid[y][x] !== 0) continue;
                const px = x * C,
                  py = y * C;
                cx.fillStyle = "#141e21";
                cx.fillRect(px, py, C, C);
                cx.strokeStyle = "rgba(40,58,62,0.5)";
                cx.lineWidth = 1;
                cx.beginPath();
                for (let i = 0; i < C; i += 4) {
                  cx.moveTo(px + i, py + C);
                  cx.lineTo(px + i + 6, py + C - 6);
                }
                cx.stroke();
                cx.fillStyle = "rgba(70,95,100,0.3)";
                cx.fillRect(px + 1, py + 1, 1, 1);
              }
            V.zones.forEach((z) => {
              const [f, e] = Z[z.type],
                ok = got.has(z.type);
              cx.fillStyle = f;
              for (let y = z.y; y < z.y + z.h; y++)
                for (let x = z.x; x < z.x + z.w; x++)
                  if (grid[y]?.[x] === 0) cx.fillRect(x * C, y * C, C, C);
              cx.strokeStyle = e;
              cx.lineWidth = ok ? 3 : 2;
              cx.globalAlpha = ok ? 1 : 0.9;
              cx.strokeRect(z.x * C + 1, z.y * C + 1, z.w * C - 2, z.h * C - 2);
              cx.globalAlpha = 1;
              cx.lineWidth = 2;
              [
                [z.x * C + 1, z.y * C + 1],
                [(z.x + z.w) * C - 1, z.y * C + 1],
                [z.x * C + 1, (z.y + z.h) * C - 1],
                [(z.x + z.w) * C - 1, (z.y + z.h) * C - 1],
              ].forEach(([mx, my]) => {
                cx.beginPath();
                cx.moveTo(mx, my);
                cx.lineTo(mx + 5, my);
                cx.moveTo(mx, my);
                cx.lineTo(mx, my + 5);
                cx.stroke();
              });
              if (ok) {
                cx.fillStyle = e;
                cx.font =
                  "bold " + Math.max(12, Math.floor(C * 0.9)) + "px sans-serif";
                cx.textAlign = "right";
                cx.textBaseline = "top";
                cx.fillText("✓", (z.x + z.w) * C - 6, z.y * C + 4);
              }
            });
            for (let y = 0; y < GH; y++)
              for (let x = 0; x < GW; x++) {
                if (grid[y][x] !== 1) continue;
                const px = x * C,
                  py = y * C;
                cx.fillStyle = "#0a0e10";
                cx.fillRect(px, py, C, C);
                cx.strokeStyle = "rgba(60,80,84,0.45)";
                cx.lineWidth = 1;
                cx.strokeRect(px + 0.5, py + 0.5, C - 1, C - 1);
                cx.strokeStyle = "rgba(80,110,115,0.25)";
                cx.beginPath();
                cx.moveTo(px + 1, py + 1);
                cx.lineTo(px + C - 1, py + 1);
                cx.stroke();
              }
            glowDot(1, 1, "#c2a878", "rgba(194,168,120,0.5)");
            glowDot(E, E, "#6b9383", "rgba(107,147,131,0.5)");
            if (trail.length > 1) {
              const pts = trail.map(([x, y]) => [x * C + C / 2, y * C + C / 2]);
              [
                ["rgba(194,168,120,0.35)", Math.max(8, C * 0.85)],
                ["#c2a878", Math.max(5, C * 0.55)],
                ["#f0d9a8", Math.max(1, C * 0.14)],
              ].forEach(([c, w]) => {
                cx.strokeStyle = c;
                cx.lineWidth = w;
                cx.lineCap = cx.lineJoin = "round";
                cx.beginPath();
                pts.forEach(([x, y], i) =>
                  i ? cx.lineTo(x, y) : cx.moveTo(x, y),
                );
                cx.stroke();
              });
              const [hx, hy] = pts[pts.length - 1],
                g = cx.createRadialGradient(hx, hy, 0, hx, hy, C * 0.55);
              g.addColorStop(0, "rgba(240,217,168,0.85)");
              g.addColorStop(1, "rgba(194,168,120,0)");
              cx.fillStyle = g;
              cx.beginPath();
              cx.arc(hx, hy, C * 0.55, 0, 7);
              cx.fill();
            }
          }
          function cell(e) {
            const r = cv.getBoundingClientRect(),
              fx = ((e.clientX - r.left) * ((C * GW) / r.width)) / C,
              fy = ((e.clientY - r.top) * ((C * GW) / r.width)) / C;
            let x = Math.floor(fx),
              y = Math.floor(fy);
            if (grid[y]?.[x] !== 0) {
              let b = null,
                bd = Infinity;
              for (
                let j = Math.max(0, y - 1);
                j <= Math.min(GH - 1, y + 1);
                j++
              )
                for (
                  let i = Math.max(0, x - 1);
                  i <= Math.min(GW - 1, x + 1);
                  i++
                ) {
                  if (grid[j][i] !== 0) continue;
                  const d = Math.hypot(i + 0.5 - fx, j + 0.5 - fy);
                  if (d < bd) {
                    bd = d;
                    b = [i, j];
                  }
                }
              if (b && bd < 1.5) {
                x = b[0];
                y = b[1];
              }
            }
            return [x, y];
          }
          function recount() {
            got = new Set();
            V.zones.forEach((z) => {
              if (
                Z[z.type][3] &&
                trail.some(
                  ([x, y]) =>
                    x >= z.x && x < z.x + z.w && y >= z.y && y < z.y + z.h,
                )
              )
                got.add(z.type);
            });
            chipsRender();
          }
          function fail(label) {
            drag = false;
            dead = true;
            ui.say(
              "bad",
              "✗ " +
                label.charAt(0).toUpperCase() +
                label.slice(1) +
                " — нельзя сюда заходить. Нажми «Сбросить».",
            );
            trail = [[1, 1]];
            seen = new Set(["1,1"]);
            got = new Set();
            chipsRender();
            paint();
            hud();
          }
          function win() {
            drag = false;
            const miss = V.required.filter((t) => !got.has(t));
            if (miss.length) {
              dead = true;
              ui.say(
                "bad",
                "✗ Дошёл до выхода, но не через все нужные места: " +
                  miss.map((t) => Z[t][2]).join(", ") +
                  ".",
              );
              hud(100);
              paint();
              return;
            }
            won = true;
            fin.add(cur);
            save(key, [...fin]);
            sync();
            ui.say("good", "✓ Уровень пройден.", "Нажми «Дальше».");
            hud(100);
            paint();
          }
          function extend(x, y) {
            if (won || dead || grid[y]?.[x] !== 0) return;
            const i = trail.findIndex((p) => p[0] === x && p[1] === y);
            if (i >= 0 && i < trail.length - 1) {
              trail = trail.slice(0, i + 1);
              seen = new Set(trail.map((p) => k(p[0], p[1])));
              recount();
              paint();
              hud();
              return;
            }
            const l = trail[trail.length - 1];
            if (
              (l[0] === x && l[1] === y) ||
              Math.abs(l[0] - x) + Math.abs(l[1] - y) !== 1 ||
              seen.has(k(x, y))
            )
              return;
            const z = zoneAt(x, y),
              t = z && z.type;
            if (t && !Z[t][3]) return fail(Z[t][2]);
            if (t && !got.has(t)) {
              got.add(t);
              chipsRender();
            }
            trail.push([x, y]);
            seen.add(k(x, y));
            if (x === E && y === E) win();
            if (!won && !dead) {
              paint();
              hud();
            }
          }
          cv.onpointerdown = (e) => {
            if (won) return;
            const [x, y] = cell(e),
              l = trail[trail.length - 1];
            cv.setPointerCapture(e.pointerId);
            if (Math.abs(x - 1) <= 1 && Math.abs(y - 1) <= 1) {
              dead = false;
              drag = true;
              trail = [[1, 1]];
              seen = new Set(["1,1"]);
              got = new Set();
              chipsRender();
              last = [1, 1];
              e.preventDefault();
              ui.say("", "Веди...");
              paint();
              hud();
              return;
            }
            if (Math.abs(x - l[0]) <= 2 && Math.abs(y - l[1]) <= 2) {
              dead = false;
              drag = true;
              last = l;
              e.preventDefault();
              ui.say("", "Веди...");
              paint();
              hud();
              return;
            }
            const i = trail.findIndex((p) => p[0] === x && p[1] === y);
            if (i >= 0) {
              trail = trail.slice(0, i + 1);
              seen = new Set(trail.map((p) => k(p[0], p[1])));
              recount();
              dead = false;
              drag = true;
              last = [x, y];
              e.preventDefault();
              ui.say("", "Откат. Веди дальше...");
              paint();
              hud();
              return;
            }
            if (!dead)
              ui.say("", "Нажми на линию.");
          };
          cv.onpointermove = (e) => {
            if (!drag || won || dead) return;
            e.preventDefault();
            const [x, y] = cell(e);
            if (!last) {
              last = [x, y];
              return;
            }
            const dx = x - last[0],
              dy = y - last[1],
              steps = Math.max(Math.abs(dx), Math.abs(dy));
            for (let i = 1; i <= steps; i++) {
              extend(
                Math.round(last[0] + (dx * i) / steps),
                Math.round(last[1] + (dy * i) / steps),
              );
              if (!drag || dead) return;
            }
            last = [x, y];
          };
          cv.onpointerup = cv.onpointercancel = () => {
            if (!drag) return;
            drag = false;
            last = null;
            if (!won && !dead)
              ui.say(
                "",
                "Веди дальше точку...",
              );
          };
          watch(ui.stage, () => {
            if (grid) {
              size();
              paint();
            }
          });
          setup(0);
        };

        const Riddle = (host, done) => {
          const R0 = [
            {
              q: "Появляется, когда есть свет, и пропадает, когда его нет. Весь день идёт за тобой, а ночью пропадает.",
              a: "тень",
              l: "Т",
            },
            {
              q: "Не совсем кот и не совсем рыба, а хвост будто из чешуи. Одни клянутся, что с ним можно поговорить, другие видели только тень на воде.",
              a: "утопец",
              l: "У",
            },
            {
              q: "Лепят из глины, сушат у огня, потом разрисовывают. Носят не для красоты, а чтобы нечисть прошла мимо.",
              a: "маска",
              l: "М",
            },
            {
              q: "Носят в зубах и прячут от чужих. Считается, что пока она с тобой, ты не один.",
              a: "амулет",
              l: "А",
            },
            {
              q: "Наступает, когда прячется солнце, и уходит с первым лучом.",
              a: "ночь",
              l: "Н",
            },
          ];
          const R = [3, 0, 4, 1, 2].map((i) => R0[i]);
          const FIN = "ТУМАН",
            key = "riddle_lv2";
          const norm = (s) =>
            String(s)
              .toLowerCase()
              .trim()
              .replace(/ё/g, "е")
              .replace(/[^a-zа-я0-9]/g, "");
          const fin = new Set(
            localStorage.getItem("riddle_done") === "1"
              ? R.keys()
              : load(key, []),
          );
          let cur = 0;
          const first = () => {
            let i = 0;
            while (i < R.length && fin.has(i)) i++;
            return i;
          };
          const ui = shell(host, R.length, (i) => {
              if (i <= first()) setup(i);
            }),
            bNext = btn("Дальше", "", next);
          ui.stage.classList.add("col");
          const box = document.createElement("div");
          box.className = "letters";
          ui.acts.after(box);

          const tiles = () =>
            '<div class="tiles-label">Буквы</div><div class="tiles">' +
            R.map(
              (r, i) =>
                '<span class="tile' +
                (fin.has(i) ? " on" : "") +
                '">' +
                (fin.has(i) ? r.l : "?") +
                "</span>",
            ).join("") +
            "</div>";
          function refresh() {
            ui.tabs(
              (i) => fin.has(i),
              cur,
              (i) => i > first(),
            );
            ui.left("Уровни <b>" + fin.size + " / " + R.length + "</b>");
            ui.right("Загадка <b>" + (cur + 1) + " / " + R.length + "</b>");
            bNext.disabled = !fin.has(cur);
            bNext.className = "btn" + (fin.has(cur) ? " primary" : "");
          }
          function lock(f, i) {
            f.value = R[i].a;
            f.disabled = true;
            f.closest(".riddle").classList.add("solved");
          }
          function setup(i) {
            cur = i;
            ui.acts.innerHTML = "";
            ui.acts.append(bNext);
            ui.stage.style.display = "";
            ui.stage.innerHTML =
              '<div class="riddle"><p>' +
              R[i].q +
              '</p><input class="field" autocomplete="off" placeholder="Ответ..."></div>';
            box.innerHTML = tiles();
            const f = $(".field", host);
            if (fin.has(i)) {
              lock(f, i);
              ui.say("good", "✓ Загадка разгадана.", "Нажми «Дальше».");
            } else {
              ui.say("", "Напиши ответ");
              const test = () => {
                if (fin.has(i) || norm(f.value) !== norm(R[i].a)) return;
                fin.add(i);
                save(key, [...fin]);
                lock(f, i);
                const t = host.querySelectorAll(".tile")[i];
                t.textContent = R[i].l;
                t.classList.add("on");
                ui.say("good", "✓ Верно!", "Нажми «Дальше».");
                refresh();
              };
              f.addEventListener("input", test);
              f.addEventListener("change", test);
              f.addEventListener("keydown", (e) => {
                if (e.key === "Enter") {
                  e.preventDefault();
                  test();
                }
              });
            }
            refresh();
          }
          function next() {
            if (!fin.has(cur)) return;
            if (cur + 1 < R.length) return setup(cur + 1);
            word();
          }
          function word() {
            ui.stage.style.display = "none";
            box.innerHTML = tiles();
            ui.acts.innerHTML = "";
            ui.right(
              "Слово <b>" +
                (localStorage.getItem("riddle_done") === "1" ? FIN : "?") +
                "</b>",
            );
            if (localStorage.getItem("riddle_done") === "1") {
              ui.acts.append(
                btn("Сбросить", "", () => {
                  localStorage.removeItem("riddle_done");
                  save(key, []);
                  done();
                  Riddle(host, done);
                }),
              );
              ui.say(
                "good",
                "✓ Слово «" + FIN + "» собрано.",
                "Задание решено.",
              );
              return;
            }
            const w = document.createElement("input");
            w.className = "field word";
            w.placeholder = "СЛОВО";
            w.autocomplete = "off";
            const go = () => {
              if (norm(w.value) !== norm(FIN)) {
                ui.say("bad", "✕ Слово неверное.", "Попробуй ещё.");
                w.value = "";
                return;
              }
              localStorage.setItem("riddle_done", "1");
              done();
              finale(host, "Слово «" + FIN + "» собрано.", done);
            };
            w.addEventListener("keydown", (e) => {
              if (e.key === "Enter") {
                e.preventDefault();
                go();
              }
            });
            ui.acts.append(w, btn("Разгадать", "primary", go));
            ui.say("", "Все буквы собраны.", "Сложи слово и впиши его.");
          }
          if (localStorage.getItem("riddle_done") === "1") {
            cur = R.length - 1;
            ui.tabs(() => true, -1);
            ui.left("Уровни <b>" + R.length + " / " + R.length + "</b>");
            word();
          } else setup(Math.min(first(), R.length - 1));
        };

        const TASKS = [
          {
            icon: " ",
            run: Sea,
            done: () => load("sea_done::" + SEED, []).length >= 5,
          },
          {
            icon: " ",
            run: Odd,
            done: () => Object.keys(load("odd_done::" + SEED, {})).length >= 5,
          },
          {
            icon: " ",
            run: Pattern,
            done: () =>
              Object.values(load("pattern_done::v6::" + SEED, {})).filter(
                Boolean,
              ).length >= 8,
          },
          {
            icon: " ",
            run: Maze,
            done: () => load("maze_done::" + SEED, []).length >= 5,
          },
          {
            icon: " ",
            run: Riddle,
            done: () => localStorage.getItem("riddle_done") === "1",
          },
        ];

        function renderList() {
          const list = $("#list");
          list.innerHTML = "";
          TASKS.forEach((t, i) => {
            const d = t.done(),
              b = document.createElement("button");
            b.className = "item" + (d ? " done" : "");
            b.innerHTML =
              "<span>Задание " +
              (i + 1) +
              "</span><em>" +
              (d ? "✓" : "") +
              "</em>";
            b.onclick = () => openTask(t, i);
            list.append(b);
          });
        }
        function openTask(t, i) {
          $("#body").innerHTML =
            '<div class="head"><div class="icon">' +
            t.icon +
            "</div><h3>Задание " +
            (i + 1) +
            '</h3></div><div id="game"></div>';
          $("#bd").classList.add("open");
          document.body.style.overflow = "hidden";
          t.run($("#game"), renderList);
        }
        function closeTask() {
          $("#bd").classList.remove("open");
          $("#body").innerHTML = "";
          document.body.style.overflow = "";
          renderList();
        }
        $("#close").onclick = closeTask;
        $("#bd").onclick = (e) => {
          if (e.target.id === "bd") closeTask();
        };
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape" && $("#bd").classList.contains("open"))
            closeTask();
        });
        renderList();
      })();
    </script>
  </body>
</html>
