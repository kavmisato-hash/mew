<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1112" />
    <title>Задания — тест</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=PT+Mono&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0b1112;
        --panel: #111a1c;
        --panel2: #162225;
        --card: #0e1618;
        --stage: #0d1517;
        --moss: #6b9383;
        --gold: #c2a878;
        --gold-hi: #f0d9a8;
        --gold-soft: rgba(194, 168, 120, 0.16);
        --text: #d4e0de;
        --muted: #798c89;
        --line: #223336;
        --line2: #31474a;
        --ok: #8ac47a;
        --err: #c07a6c;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        background: var(--bg);
        color: var(--text);
        font: 16px/1.6 "PT Serif", serif;
        min-height: 100vh;
        overflow-x: hidden;
        padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px));
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: -1;
        background:
          radial-gradient(circle at 12% 8%, rgba(107, 147, 131, 0.07), transparent 42%),
          radial-gradient(circle at 88% 36%, rgba(194, 168, 120, 0.04), transparent 42%),
          radial-gradient(circle at 50% 100%, rgba(174, 189, 189, 0.05), transparent 55%);
      }
      .fog {
        position: fixed;
        top: -25%;
        left: -25%;
        width: 150%;
        height: 150%;
        pointer-events: none;
        filter: blur(30px);
        mix-blend-mode: screen;
        opacity: 0.85;
      }
      .f1 { background: radial-gradient(ellipse 55% 35% at 20% 30%, rgba(215, 226, 224, 0.07), transparent 70%); }
      .f2 { background: radial-gradient(ellipse 45% 30% at 80% 65%, rgba(194, 168, 120, 0.06), transparent 70%); }
      .f3 { background: radial-gradient(ellipse 60% 40% at 55% 90%, rgba(107, 147, 131, 0.08), transparent 70%); }
      .vignette {
        position: fixed;
        inset: 0;
        z-index: 5;
        pointer-events: none;
        background: radial-gradient(ellipse 75% 65% at 50% 45%, transparent 45%, rgba(6, 9, 10, 0.55) 100%);
      }
      .firefly {
        position: fixed;
        width: 2px;
        height: 2px;
        background: var(--gold);
        opacity: 0;
        animation: drift 10s ease-in-out infinite;
        pointer-events: none;
        z-index: 1;
        box-shadow: 0 0 6px 1px rgba(194, 168, 120, 0.6);
      }
      @keyframes drift {
        0% { opacity: 0; transform: translate(0, 0); }
        50% { opacity: 0.55; transform: translate(-15px, -22px); }
        100% { opacity: 0; transform: translate(-5px, -42px); }
      }
      @keyframes shake {
        25% { transform: translateX(-4px); }
        75% { transform: translateX(4px); }
      }
      h1, h3, .display { font-family: "Cormorant Garamond", serif; font-weight: 400; }
      .wrap {
        max-width: 760px;
        margin: 0 auto;
        padding: calc(36px + env(safe-area-inset-top, 0px)) 16px 0;
        position: relative;
        z-index: 2;
      }
      .list { display: flex; flex-direction: column; gap: 8px; }
      .item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
        padding: 14px 16px;
        background: var(--panel2);
        border: 1px solid var(--line);
        color: var(--text);
        font: 15px "PT Serif", serif;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      .item:active { background: var(--card); }
      .item.done { color: var(--muted); }
      .item .mark { color: var(--ok); }
      .all {
        margin-top: 22px;
        text-align: center;
        font: 22px "Cormorant Garamond", serif;
        color: var(--gold);
      }
      .reset-all {
        display: block;
        margin: 36px auto 0;
        padding: 8px 12px;
        background: none;
        border: none;
        color: var(--muted);
        opacity: 0.45;
        font: 10px "PT Mono", monospace;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      .reset-all:hover { color: var(--err); opacity: 1; }

      .backdrop {
        position: fixed;
        inset: 0;
        background: rgba(6, 10, 11, 0.88);
        display: none;
        align-items: flex-start;
        justify-content: center;
        z-index: 1000;
        padding: 24px 16px;
        overflow-y: auto;
        backdrop-filter: blur(6px);
      }
      .backdrop.open { display: flex; }
      .modal {
        background: var(--panel);
        border: 1px solid var(--line);
        padding: 18px 14px 12px;
        width: 100%;
        max-width: 560px;
        margin: auto;
        flex-shrink: 0;
        position: relative;
        box-shadow: 0 30px 80px -30px rgba(0, 0, 0, 0.85), 0 0 0 1px var(--gold-soft);
      }
      .modal::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        height: 2px;
        width: 64px;
        background: linear-gradient(90deg, var(--gold), transparent);
      }
      .close {
        position: absolute;
        top: 14px;
        right: 16px;
        background: none;
        border: none;
        padding: 6px;
        color: var(--muted);
        font-size: 22px;
        line-height: 1;
        cursor: pointer;
      }
      .close:hover { color: var(--gold); }
      .head { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; padding-right: 24px; }
      .icon {
        width: 34px;
        height: 34px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--panel2);
        border: 1px solid var(--gold-soft);
        color: var(--gold);
        font-size: 15px;
      }
      .head h3 { font-size: 19px; color: var(--gold); margin: 0; }

      .tabs { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
      .tab {
        flex: 1 1 44px;
        padding: 9px 4px;
        background: none;
        border: 1px solid var(--line);
        color: var(--muted);
        font: 11px "PT Mono", monospace;
        letter-spacing: 0.1em;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }
      .tab:hover:not(:disabled) { border-color: rgba(194, 168, 120, 0.4); color: var(--gold); }
      .tab:disabled { opacity: 0.3; cursor: not-allowed; }
      .tab.done { border-color: var(--ok); color: var(--ok); background: rgba(138, 196, 122, 0.14); }
      .tab.active { border-color: var(--gold); color: var(--gold); background: rgba(194, 168, 120, 0.1); }
      .legend, .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 8px;
        margin-bottom: 6px;
        font: 10px "PT Mono", monospace;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .legend span { display: inline-flex; align-items: center; gap: 5px; }
      .legend i {
        width: 12px;
        height: 12px;
        border-radius: 2px;
        border: 1px solid rgba(255, 255, 255, 0.14);
      }
      .chips span {
        padding: 4px 9px;
        border: 1px solid rgba(194, 168, 120, 0.25);
        color: var(--gold);
        background: rgba(194, 168, 120, 0.08);
      }
      .chips .done {
        color: var(--ok);
        border-color: rgba(138, 196, 122, 0.5);
        background: rgba(138, 196, 122, 0.12);
      }
      .chips .no {
        color: var(--err);
        border-color: rgba(192, 122, 108, 0.4);
        background: rgba(192, 122, 108, 0.08);
      }
      .row {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 6px;
        font: 10px/1.4 "PT Mono", monospace;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .row b { color: var(--gold); font-weight: 400; }
      .row b.warn { color: #e05a30; }
      .stage {
        display: flex;
        justify-content: center;
        background: radial-gradient(circle at 50% 45%, #0f1b20 0%, #08100e 100%);
        border: 1px solid var(--line);
        border-radius: 3px;
        padding: 10px;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      .stage.col {
        display: block;
        user-select: text;
        -webkit-user-select: text;
        background: #101a1c;
        border-color: rgba(60, 80, 84, 0.5);
        box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.3);
      }
      .stage.bare { padding: 0; background: none; border: none; border-radius: 0; }
      .stage.bare canvas { border: none; }
      .stage canvas {
        display: block;
        max-width: 100%;
        border: 1px solid #1a2528;
        cursor: crosshair;
        touch-action: manipulation;
      }
      .drag .stage canvas { touch-action: none; }
      .acts { display: flex; gap: 8px; margin-top: 8px; }
      .btn {
        flex: 1;
        padding: 12px 10px;
        background: none;
        border: 1px solid var(--line);
        border-radius: 3px;
        color: var(--muted);
        font: 11px "PT Mono", monospace;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      .btn:hover:not(:disabled) {
        border-color: rgba(194, 168, 120, 0.4);
        color: var(--gold);
        background: rgba(194, 168, 120, 0.04);
      }
      .btn.primary { background: var(--gold); border-color: var(--gold); color: var(--bg); font-weight: 700; }
      .btn.primary:hover:not(:disabled) { background: #d4ba8a; color: var(--bg); }
      .btn:disabled { opacity: 0.35; cursor: not-allowed; }
      .status {
        margin-top: 8px;
        min-height: 38px;
        padding: 10px 12px;
        font-size: 12px;
        line-height: 1.45;
        border-left: 3px solid var(--line);
        border-radius: 0 3px 3px 0;
        background: var(--stage);
        color: var(--muted);
      }
      .status .sub {
        display: block;
        margin-top: 4px;
        font-size: 10.5px;
        letter-spacing: 0.05em;
        opacity: 0.85;
      }
      .status.good { color: var(--ok); border-color: var(--ok); background: rgba(138, 196, 122, 0.07); }
      .status.bad { color: var(--err); border-color: var(--err); background: rgba(192, 122, 108, 0.07); }
      .final {
        padding: 28px 18px;
        text-align: center;
        border: 1px solid rgba(194, 168, 120, 0.35);
        border-radius: 3px;
        background: radial-gradient(ellipse 90% 40% at 50% 0%, rgba(194, 168, 120, 0.1), transparent 70%);
      }
      .final .big { font: 28px "Cormorant Garamond", serif; color: var(--gold); margin-bottom: 6px; }
      .final .small { font-size: 13px; color: var(--muted); margin-bottom: 18px; }
      .final .btn { width: 100%; }

      .grid {
        position: relative;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        width: 100%;
        background: #080c0e;
        border: 1px solid rgba(60, 80, 84, 0.5);
      }
      .grid::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(ellipse 75% 75% at 50% 50%, transparent 40%, rgba(0, 0, 0, 0.55) 100%);
      }
      .card {
        position: relative;
        aspect-ratio: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 10px;
        background: #0a1114;
        border: 1px solid rgba(60, 80, 84, 0.26);
        cursor: pointer;
      }
      .card:nth-child(even) { background: #0d1418; }
      .card img {
        max-width: 88%;
        max-height: 88%;
        object-fit: contain;
        pointer-events: none;
        filter: drop-shadow(0 3px 8px rgba(0, 0, 0, 0.45));
      }
      .card span { font-size: 12px; text-align: center; color: var(--muted); }
      .card:hover { background: rgba(194, 168, 120, 0.07); }
      .card.selected {
        background: rgba(194, 168, 120, 0.09);
        box-shadow: inset 0 0 0 2px rgba(194, 168, 120, 0.9);
      }
      .card.locked { cursor: default; pointer-events: none; }
      .card.right {
        background: rgba(138, 196, 122, 0.08);
        box-shadow: inset 0 0 0 2px rgba(138, 196, 122, 0.7);
      }
      .card.right::after {
        content: "✓";
        position: absolute;
        right: 7px;
        top: 4px;
        color: var(--ok);
        font-size: 15px;
        font-weight: 700;
      }
      .grid.shake { animation: shake 0.4s; }

      .riddle { padding: 14px 4px 4px; text-align: center; }
      .riddle p { margin: 0 0 16px; font: 500 20px/1.45 "Cormorant Garamond", serif; }
      .riddle.shake { animation: shake 0.4s; }
      .field {
        width: 100%;
        padding: 10px 12px;
        background: #0c1416;
        border: 1px solid rgba(60, 80, 84, 0.5);
        color: var(--text);
        text-align: center;
        font: 16px "PT Serif", serif;
      }
      .field:focus { outline: none; border-color: var(--gold-soft); }
      .solved .field { color: var(--gold); border-color: var(--gold-soft); background: var(--gold-soft); }
      .field.word {
        flex: 1;
        min-width: 0;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        font: 18px "PT Mono", monospace;
        color: var(--gold);
        background: #141f22;
      }
      .letters {
        margin-top: 10px;
        padding: 12px 12px 14px;
        background: #101a1c;
        border: 1px solid rgba(60, 80, 84, 0.5);
        box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.3);
        border-radius: 3px;
      }
      .tiles-label {
        text-align: center;
        font: 10px "PT Mono", monospace;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .tiles { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 10px; }
      .tile {
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        font: 22px "Cormorant Garamond", serif;
        color: var(--muted);
        background: #141f22;
        border: 1px solid rgba(60, 80, 84, 0.5);
        border-radius: 2px;
      }
      .tile.on {
        color: var(--gold);
        border-color: rgba(194, 168, 120, 0.5);
        background: rgba(194, 168, 120, 0.08);
      }

      @media (max-width: 600px) {
        .backdrop { padding: 6px; align-items: center; }
        .modal { padding: 12px 10px 8px; }
        .head { gap: 8px; margin-bottom: 8px; }
        .icon { width: 28px; height: 28px; font-size: 13px; }
        .head h3 { font-size: 16px; }
        .stage { padding: 6px; }
        .btn { min-height: 38px; font-size: 10px; letter-spacing: 0.06em; }
        .tab { font-size: 10px; padding: 6px 4px; }
        .card { padding: 4px; }
        .tile { width: 32px; height: 32px; font-size: 16px; }
        .status { min-height: 34px; padding: 8px 10px; font-size: 11.5px; }
        .riddle { padding: 10px 2px 2px; }
        .riddle p { font-size: 18px; }
      }
    </style>
  </head>
  <body>
    <span class="fog f1"></span><span class="fog f2"></span><span class="fog f3"></span>
    <span class="firefly" style="top: 20%; left: 75%"></span>
    <span class="firefly" style="top: 60%; left: 85%; animation-delay: 2.5s"></span>
    <span class="firefly" style="top: 75%; left: 65%; animation-delay: 7.5s"></span>
    <div class="vignette"></div>

    <div class="wrap">
      <div class="list" id="list"></div>
      <button class="reset-all" id="resetAll">
        Сбросить прогресс
      </button>
    </div>

    <div class="backdrop" id="bd">
      <div class="modal">
        <button class="close" id="close">✕</button>
        <div id="body"></div>
      </div>
    </div>

    <script>
      (function () {
        "use strict";

        const SEED = 170717,
          ROM = ["I", "II", "III", "IV", "V", "VI", "VII", "VIII"];
        const $ = (s, r = document) => r.querySelector(s);
        const load = (k, d) => {
          try {
            const v = JSON.parse(localStorage.getItem(k));
            return v == null ? d : v;
          } catch (e) {
            return d;
          }
        };
        const save = (k, v) => {
          try {
            localStorage.setItem(k, JSON.stringify(v));
          } catch (e) {}
        };
        const rng = (s) => {
          s = s >>> 0 || 1;
          return () => {
            s = (s + 0x6d2b79f5) | 0;
            let t = Math.imul(s ^ (s >>> 15), 1 | s);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        };
        const shuf = (a, r) => {
          a = a.slice();
          for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(r() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
          }
          return a;
        };
        const watch = (el, f) => new ResizeObserver(f).observe(el);
        const btn = (t, c, f) => {
          const e = document.createElement("button");
          e.className = "btn " + c;
          e.textContent = t;
          e.onclick = f;
          return e;
        };

        const drawPaw = (c, x, y, s, color) => {
          c.save();
          c.translate(x, y + s * 0.1);
          c.scale(s, s);
          c.fillStyle = color;
          c.beginPath();
          c.moveTo(0, 0.05);
          c.bezierCurveTo(0.45, 0.05, 0.85, 0.4, 0.8, 0.75);
          c.bezierCurveTo(0.75, 1.05, 0.4, 1.0, 0, 0.9);
          c.bezierCurveTo(-0.4, 1.0, -0.75, 1.05, -0.8, 0.75);
          c.bezierCurveTo(-0.85, 0.4, -0.45, 0.05, 0, 0.05);
          c.fill();
          [
            [-0.95, -0.2, -0.5],
            [-0.38, -0.8, -0.15],
            [0.38, -0.8, 0.15],
            [0.95, -0.2, 0.5],
          ].forEach(([ex, ey, r]) => {
            c.beginPath();
            c.ellipse(ex, ey, 0.25, 0.36, r, 0, 7);
            c.fill();
          });
          c.restore();
        };
        const pawImg = new Image();
        pawImg.src = "img/paw.png";
        const pawBg = new Image();
        pawBg.src = "img/paw.png";
        const tintCache = {};
        const pawTint = (color) => {
          if (!pawImg.complete || !pawImg.naturalWidth) return null;
          if (tintCache[color]) return tintCache[color];
          const c = document.createElement("canvas");
          c.width = pawImg.naturalWidth;
          c.height = pawImg.naturalHeight;
          const g = c.getContext("2d");
          g.drawImage(pawImg, 0, 0);
          g.globalCompositeOperation = "source-in";
          g.fillStyle = color;
          g.fillRect(0, 0, c.width, c.height);
          return (tintCache[color] = c);
        };
        const drawPawImg = (c, x, y, s, color, ang) => {
          c.save();
          c.translate(x, y);
          c.rotate(ang || 0);
          const t = pawTint(color);
          if (!t) drawPaw(c, 0, 0, s, color);
          else {
            const w = s * 2.2,
              h = (w * t.height) / t.width;
            c.drawImage(t, -w / 2, -h / 2, w, h);
          }
          c.restore();
        };

        const DPR = () => Math.min(devicePixelRatio || 1, 2);
        const fit = (cv, w, h) => {
          const d = DPR();
          cv.width = Math.round(w * d);
          cv.height = Math.round(h * d);
          cv.style.width = w + "px";
          cv.style.height = h + "px";
          const c = cv.getContext("2d");
          c.setTransform(d, 0, 0, d, 0, 0);
          return c;
        };
        const mk = (w, h, k) => {
          const c = document.createElement("canvas");
          c.width = Math.max(1, Math.round(w * k));
          c.height = Math.max(1, Math.round(h * k));
          const g = c.getContext("2d");
          g.setTransform(k, 0, 0, k, 0, 0);
          return [c, g];
        };
        const SPR = {};
        const spr = (rgb, size = 96, core = 0) => {
          const k = rgb + "|" + size + "|" + core;
          if (SPR[k]) return SPR[k];
          const [c, g] = mk(size, size, 1),
            r = size / 2,
            gr = g.createRadialGradient(r, r, 0, r, r, r);
          gr.addColorStop(0, "rgba(" + rgb + ",1)");
          if (core) gr.addColorStop(core, "rgba(" + rgb + ",1)");
          else gr.addColorStop(0.45, "rgba(" + rgb + ",.35)");
          gr.addColorStop(1, "rgba(" + rgb + ",0)");
          g.fillStyle = gr;
          g.fillRect(0, 0, size, size);
          return (SPR[k] = c);
        };
        const blob = (c, s, x, y, r) =>
          c.drawImage(s, x - r, y - r, r * 2, r * 2);
        const fogPuffs = (c, w, h, t, n, alpha, rgb, ph) => {
          const s = spr(rgb || "190,208,205", 128);
          c.globalAlpha = alpha;
          for (let i = 0; i < n; i++) {
            const j = i + (ph || 0);
            blob(
              c,
              s,
              w * (0.5 + 0.6 * Math.sin(t * 0.07 * ((j % 5) + 1) + j * 1.7)),
              h * (0.5 + 0.55 * Math.cos(t * 0.05 * ((j % 4) + 1) + j * 2.3)),
              Math.max(w, h) * (0.2 + 0.08 * Math.sin(j + t * 0.2)),
            );
          }
          c.globalAlpha = 1;
        };

        function shell(host, count, pick) {
          host.classList.add("task");
          host.innerHTML =

            b.innerHTML = "<span>Задание " + (i + 1) + '</span><span class="mark">' + (ok ? "✓" : "") + "</span>";
            b.onclick = () => openTask(t, i);
            list.append(b);
          });
          if (all) {
            const e = document.createElement("div");
            e.className = "all";
            e.textContent = "Все задания выполнены";
            list.append(e);
          }
        }
        function openTask(t, i) {
          $("#body").innerHTML =
            '<div class="head"><h3>Задание ' +
            (i + 1) +
            '</h3></div><div id="game"></div>';
          $("#bd").classList.add("open");
          document.body.style.overflow = "hidden";
          t.run($("#game"), closeTask);
        }
        function closeTask() {
          $("#bd").classList.remove("open");
          $("#body").innerHTML = "";
          document.body.style.overflow = "";
          renderList();
        }
        $("#close").onclick = closeTask;
        $("#bd").onclick = (e) => {
          if (e.target.id === "bd") closeTask();
        };
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape" && $("#bd").classList.contains("open")) closeTask();
        });
        $("#resetAll").onclick = () => {
          if (!confirm("Сбросить весь прогресс по всем заданиям?")) return;
          [
            "sea_done::" + SEED,
            "odd_done::" + SEED,
            "odd_done::" + SEED + "::a",
            "odd_user_seed",
            "pattern_done::v6::" + SEED,
            "maze_done::" + SEED,
            "riddle_lv2",
            "riddle_done",
            "riddle_user_seed",
          ].forEach((k) => localStorage.removeItem(k));
          location.reload();
        };
        renderList();
      })();
    </script>
  </body>
</html>
